<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视听 · 双语字幕</title><link rel="stylesheet" href="popup.css"></head><body><main><header><h1>视听 <span>YouTube</span></h1><p>英语原声 · 中文字幕</p></header><form id="settings"><label for="token">桌面端配对码</label><input id="token" type="password" autocomplete="off" placeholder="从视听桌面端设置中复制" required><label for="provider">翻译方式</label><select id="provider"><option value="local">本地翻译</option><option value="google">Google Cloud</option><option value="volcano">火山翻译</option></select><p class="note">先启动视听桌面端。云翻译密钥在桌面端设置，音频识别始终在本机进行。</p><div class="actions"><button class="primary" id="start" type="submit">开启当前视频字幕</button><button id="stop" type="button">停止</button></div></form><p id="status" role="status" aria-live="polite">尚未开启</p><footer>仅捕获当前标签页声音，不使用麦克风。</footer></main><script type="module" src="popup.js"></script></body></html>
